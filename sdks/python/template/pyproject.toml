[project]
name = "{{name}}"
version = "0.1.0"
description = "An ankka-flow streamlet."
requires-python = ">=3.12"
dependencies = ["ankka-flow=={{version}}"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ankka-flow]
streamlet = "{{module}}.streamlet:Echo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{module}}"]
