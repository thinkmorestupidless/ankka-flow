# The sidecar's configuration on a laptop. In a cluster the operator renders this file from the
# pipeline resource; here it is written by hand. descriptor.json lands beside it (uv run descriptor).
flow {
  pipeline  = {{name}}
  streamlet = echo
  config    = {}
  inlets {
    in {
      topic             = "{{name}}.input"
      group             = "{{name}}.echo.in"
      client-id         = "{{name}}.echo.in"
      bootstrap.servers = "kafka:9092"
      connection-config {}
      consumer-config { auto.offset.reset = earliest }
      batch { max-records = 100, max-bytes = 1 MiB }
    }
  }
  outlets {
    out {
      topic             = "{{name}}.output"
      client-id         = "{{name}}.echo.out"
      bootstrap.servers = "kafka:9092"
      connection-config {}
      producer-config {}
    }
  }
}
