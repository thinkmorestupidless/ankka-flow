[project]
name = "ankka-flow"
dynamic = ["version"]
description = "Write ankka-flow streamlets in Python: declare ports, process batches, let the sidecar own Kafka."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["ankka", "ankka-flow", "kafka", "streaming", "sidecar"]
dependencies = [
    "grpcio>=1.84,<2",
    "protobuf>=6,<8",
]

[project.urls]
Homepage = "https://flow.ankka.cloud/"
Documentation = "https://flow.ankka.cloud/reference/python-sdk/"
Repository = "https://github.com/thinkmorestupidless/ankka-flow"

[project.scripts]
descriptor = "ankka_flow._descriptor:main"
conformance = "ankka_flow._conformance:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84,<2",
    "pytest>=8",
    "mypy>=1.13",
    "types-protobuf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ankka_flow/__init__.py"

[tool.hatch.build]
artifacts = ["src/ankka_flow/_proto/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/ankka_flow"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["ankka_flow"]
mypy_path = "src"
exclude = ["_proto"]

[[tool.mypy.overrides]]
module = ["ankka_flow._proto.*", "grpc.*", "grpc_tools.*"]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"
