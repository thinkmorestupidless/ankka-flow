pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = INFO
  # The sidecar's own shutdown hook stops the supervisor first, then terminates the system.
  jvm-shutdown-hooks = off
  coordinated-shutdown.run-by-jvm-shutdown-hook = off

  kafka.consumer {
    # Revocation must reach the stream promptly.
    stop-timeout = 2s
    # The consumer actor polls on this tick when records are wanted. Pekko's 50 ms default puts up
    # to 50 ms between a record's arrival and its batch, and SC-008 allows 10 ms for the whole path.
    poll-interval = 10ms
    # The actor blocks in poll for up to this long, and demand for a paused partition waits for the
    # poll to return. 50 ms (the default) put a 40 ms tail on a quiet stream; 2 ms thrashes; 5 ms was
    # the measured best (LatencyBenchSuite, research).
    poll-timeout = 5ms
  }
}
