# Prometheus JMX exporter rules for the ankka-flow sidecar.
#
# The Kafka rules are carried from Cloudflow's runtimes/pekko/prometheus.yaml
# (core/cloudflow-sbt-plugin/src/main/resources/runtimes/pekko/prometheus.yaml),
# Copyright (C) 2016-2026 Lightbend Inc. <https://www.lightbend.com>, Apache License 2.0.
# Every Kafka client's id is <pipeline>.<streamlet>.<port>, so `client_id` attributes lag and
# throughput to a streamlet's port (FR-015). Order matters: records-lag-max must match before
# records-lag, whose pattern is its prefix.
#
# The exporter matches against `domain<properties><>Attribute: value`, with the attribute name as the
# bean spells it (attrNameSnakeCase only changes default names), so each pattern ends in `:` to
# stop at the attribute name: without it `records-lag` also matches `records-lag-avg`.
lowercaseOutputName: true
attrNameSnakeCase: true
rules:
  # Kafka Consumer lag and throughput, Kafka Producer throughput metrics
  - pattern: 'kafka\.consumer<type=consumer-fetch-manager-metrics,\s*client-id=(\S+),\s*topic=(\S+),\s*partition=([0-9]+).*><>records-lag-max:'
    name: kafka_consumer_consumer_fetch_manager_metrics_records_lag_max
    type: GAUGE
    labels:
      client_id: "$1"
      topic: "$2"
      partition: "$3"
  - pattern: 'kafka\.consumer<type=consumer-fetch-manager-metrics,\s*client-id=(\S+),\s*topic=(\S+),\s*partition=([0-9]+).*><>records-lag:'
    name: kafka_consumer_consumer_fetch_manager_metrics_records_lag
    type: GAUGE
    labels:
      client_id: "$1"
      topic: "$2"
      partition: "$3"
  - pattern: 'kafka\.consumer<type=consumer-fetch-manager-metrics,\s*client-id=(\S+),\s*topic=(\S+).*><>records-consumed-rate:'
    name: kafka_consumer_consumer_fetch_manager_metrics_records_consumed_rate
    type: GAUGE
    labels:
      client_id: "$1"
      topic: "$2"
  - pattern: 'kafka\.producer<type=producer-topic-metrics,\s*client-id=(\S+),\s*topic=(\S+).*><>record-send-rate:'
    name: kafka_producer_producer_metrics_record_send_rate
    type: GAUGE
    labels:
      client_id: "$1"
      topic: "$2"
  # The sidecar's own, one bean per inlet partition it has run (research R7).
  - pattern: 'ankka\.flow<type=sidecar,\s*inlet=(\S+),\s*partition=([0-9]+)><>InFlight:'
    name: ankka_flow_sidecar_in_flight
    type: GAUGE
    labels:
      inlet: "$1"
      partition: "$2"
  - pattern: 'ankka\.flow<type=sidecar,\s*inlet=(\S+),\s*partition=([0-9]+)><>StalledSeconds:'
    name: ankka_flow_sidecar_stalled_seconds
    type: GAUGE
    labels:
      inlet: "$1"
      partition: "$2"
  # A built-in stage's own, one bean per inlet partition it has processed (feature 002, research R11).
  - pattern: 'ankka\.flow<type=stage,\s*inlet=(\S+),\s*partition=([0-9]+)><>DeltasWritten:'
    name: ankka_flow_stage_deltas_written_total
    type: COUNTER
    labels:
      inlet: "$1"
      partition: "$2"
  - pattern: 'ankka\.flow<type=stage,\s*inlet=(\S+),\s*partition=([0-9]+)><>DeltasStale:'
    name: ankka_flow_stage_deltas_stale_total
    type: COUNTER
    labels:
      inlet: "$1"
      partition: "$2"
  - pattern: 'ankka\.flow<type=stage,\s*inlet=(\S+),\s*partition=([0-9]+)><>BatchesFailed:'
    name: ankka_flow_stage_batches_failed_total
    type: COUNTER
    labels:
      inlet: "$1"
      partition: "$2"
  - pattern: 'ankka\.flow<type=stage,\s*inlet=(\S+),\s*partition=([0-9]+)><>DeleteMarkers:'
    name: ankka_flow_stage_delete_markers_total
    type: COUNTER
    labels:
      inlet: "$1"
      partition: "$2"
