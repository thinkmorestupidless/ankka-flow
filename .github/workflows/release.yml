name: release

# A tag is a release. A tag with a hyphen (v0.4.0-rc.1) is a pre-release: it gets the release page,
# the native `flow` binaries and the Homebrew formula, and nothing else — no image reaches the
# registry, no wheel reaches PyPI, no plugin reaches the marketplace. `images`, `sdk-python` and
# `marketplace` are gated on the tag's name below; `release-page`, `cli-native` and `homebrew` run on
# every tag, and the three publishing jobs do not wait on them.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  release-page:
    # The tag's GitHub release, created here so that every `cli-native` leg has somewhere to upload
    # to whichever finishes first. With the workflow's own token, as ankka's `cli` job does. A re-run
    # of the workflow finds the release and leaves it. A pre-release tag is marked as one on GitHub.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"
          else
            prerelease=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "ankka-flow $version" --generate-notes "${prerelease[@]}"
          fi

  cli-native:
    # The `flow` CLI as one executable per platform, needing no JVM: GraalVM's native-image over
    # the same classpath `sbt cli/stage` lays out. native-image cannot cross-compile, so each platform
    # builds on its own runner. Each binary is attached to the tag's release as
    # ankka-flow-cli-<version>-<platform>.tar.gz (a tarball, so the executable bit survives the
    # download) with a .sha256 beside it.
    #
    # The binary is held to the JVM build, not trusted: the CLI's own suite runs against it, and the
    # smoke script asks it for each thing a native image can silently lose and compares every output
    # byte for byte with the JVM build's.
    needs: release-page
    strategy:
      # One platform's failure must not cancel the others: a re-run of the failed leg finishes the
      # release, and the upload replaces rather than duplicates.
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binary links the build machine's glibc, and an older one runs on
          # more distributions. Alpine (musl) runs none of these.
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: macos-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # the release's assets, with the workflow's own token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dynver needs the tags: `flow version` is the release version
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: sbt
          github-token: ${{ github.token }}
      - uses: sbt/setup-sbt@v1
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          git diff-index --quiet HEAD -- || { echo "::error::${{ matrix.platform }}: working tree is dirty"; git status --porcelain; exit 1; }
      - run: sbt cli/stage cli/GraalVMNativeImage/packageBin
      - name: The CLI's suite, against the binary
        run: sbt 'cli/test' -Dflow.cli.binary="$PWD/cli/target/graalvm-native-image/flow"
      - name: Everything a native image can silently lose, compared with the JVM build
        run: cli/native-smoke.sh cli/target/graalvm-native-image/flow "${GITHUB_REF_NAME#v}" cli/target/universal/stage/bin/flow
      - name: Attach the binary to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="ankka-flow-cli-$version-${{ matrix.platform }}.tar.gz"
          # From inside the directory, so the checksum line names the bare file and
          # `shasum -a 256 -c` verifies it where it was downloaded. shasum, not sha256sum, because
          # macOS runners carry only the first.
          ( cd cli/target/graalvm-native-image \
              && tar -czf "$archive" flow \
              && shasum -a 256 "$archive" > "$archive.sha256" )
          gh release upload "$GITHUB_REF_NAME" \
            "cli/target/graalvm-native-image/$archive" \
            "cli/target/graalvm-native-image/$archive.sha256" \
            --clobber

  homebrew:
    # `flow` as a Homebrew formula: `brew install thinkmorestupidless/tap/ankka-flow`. The formula —
    # canonical in homebrew/ here, with version 0.0.0 and a checksum of zeros per platform — installs
    # the native build for the machine it runs on, so it waits for every leg of `cli-native` and
    # takes each checksum from the .sha256 that leg published beside its tarball. It is then committed
    # to thinkmorestupidless/homebrew-tap, the tap ankka's CLI ships through: the tap is cloned, the
    # one file written, and an ordinary commit pushed — never a force push, which would erase the
    # other formulae the tap holds.
    #
    # Needs `HOMEBREW_TAP_TOKEN`: a token with contents:write on homebrew-tap, because the workflow's
    # own token has no access to another repository.
    needs: cli-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # With credentials persisted, git would use the workflow's own token for every github.com
          # URL and the push below would authenticate as github-actions[bot] and be refused.
          persist-credentials: false
      - name: Write the formula and commit it to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$HOMEBREW_TAP_TOKEN" ] || { echo "::error::the secret HOMEBREW_TAP_TOKEN is not set: a token with contents:write on thinkmorestupidless/homebrew-tap"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          # The placeholders, by the same rule as the plugin's version: written here, never by the
          # build, so no tracked file is dirtied during publish. The version is written into the
          # urls, and nowhere else: Homebrew reads it from there. Each checksum line names its
          # platform in a comment, which is what this matches on.
          sed -i "/^ *url /s/0\.0\.0/$version/g" homebrew/Formula/ankka-flow.rb
          mkdir -p "$RUNNER_TEMP/sums"
          for platform in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            archive="ankka-flow-cli-$version-$platform.tar.gz"
            gh release download "$GITHUB_REF_NAME" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/sums" --clobber
            sum="$(cut -d' ' -f1 "$RUNNER_TEMP/sums/$archive.sha256")"
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$archive.sha256 holds no checksum: '$sum'"; exit 1; }
            sed -i "s/0\{64\}\(\" # $platform\)$/$sum\1/" homebrew/Formula/ankka-flow.rb
          done
          # A placeholder left behind is a formula that installs nothing on that platform.
          if grep -n '0\{64\}' homebrew/Formula/ankka-flow.rb; then
            echo "::error::a checksum placeholder survived"; exit 1
          fi
          [ "$(grep -c "^ *url .*/v$version/ankka-flow-cli-$version-" homebrew/Formula/ankka-flow.rb)" = 4 ] || { echo "::error::the version was not written into every url"; grep -n url homebrew/Formula/ankka-flow.rb; exit 1; }
          remote="https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/thinkmorestupidless/homebrew-tap.git"
          git clone --depth 1 "$remote" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "ankka-flow release"
          git config user.email "release@ankka-flow.invalid"
          mkdir -p Formula
          # The one file that is ours. Every other file in the tap is another project's and is kept
          # as found.
          cp "$GITHUB_WORKSPACE/homebrew/Formula/ankka-flow.rb" Formula/ankka-flow.rb
          git add Formula/ankka-flow.rb
          # A re-run of one `cli-native` leg re-runs this job too; when the rebuilt binary's checksum
          # is the one already in the tap there is nothing to commit, and that is success.
          if git diff --cached --quiet; then
            echo "the tap already holds ankka-flow $version with these checksums"; exit 0
          fi
          git commit -m "ankka-flow $version"
          # Another project's release may have pushed between the clone and here: one rebase and retry.
          git push origin HEAD:main || { git fetch --depth 1 origin main && git rebase origin/main && git push origin HEAD:main; }

  images:
    # A release tag only: a pre-release (a tag with a hyphen) publishes no image.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the sidecar, the operator and the samples
        env:
          DOCKER_REPOSITORY: ghcr.io/thinkmorestupidless
        run: |
          sbt -Dflow.cluster.tests=off sidecar/docker:publish operator/docker:publish
          version="${GITHUB_REF_NAME#v}"
          docker build -f samples/cart-router/Dockerfile -t "ghcr.io/thinkmorestupidless/sample-cart-router:${version}" .
          docker push "ghcr.io/thinkmorestupidless/sample-cart-router:${version}"
          docker build -f samples/checkout-feed/Dockerfile -t "ghcr.io/thinkmorestupidless/sample-checkout-feed:${version}" .
          docker push "ghcr.io/thinkmorestupidless/sample-checkout-feed:${version}"
          docker build -f samples/checkout-graph/Dockerfile -t "ghcr.io/thinkmorestupidless/sample-checkout-graph:${version}" .
          docker push "ghcr.io/thinkmorestupidless/sample-checkout-graph:${version}"

  sdk-python:
    # The Python SDK to PyPI, as the package `ankka-flow`: https://pypi.org/project/ankka-flow/. The
    # version is `__version__` in sdks/python/src/ankka_flow/__init__.py — 0.0.0 in the tree, written
    # here from the tag and read by hatchling as the package version — so the version the SDK reports
    # to the sidecar in discovery, and the one a descriptor records, is the one on PyPI. The gRPC stubs
    # are generated from this commit's `protocol/`, so the wheel speaks the protocol of the release it
    # is named after.
    #
    # No token anywhere: PyPI trusts this workflow directly (trusted publishing, OIDC), as ankka's
    # release does. It needs one thing outside this repository, once: on
    # https://pypi.org/manage/account/publishing/ a publisher for project `ankka-flow`, owner
    # `thinkmorestupidless`, repository `ankka-flow`, workflow `release.yml`, environment `pypi` — a
    # "pending" publisher until the first upload creates the project.
    #
    # It waits for the images: the SDK's project template runs the sidecar image of the same version,
    # so a release whose images never reached the registry should not exist on PyPI either. A version
    # can never be re-uploaded to PyPI, only superseded, so the checks below are the last point at which
    # a release can be withdrawn.
    needs: images
    # A release tag only: a pre-release (a tag with a hyphen) reaches no registry. `needs` alone
    # would not do it: a skipped `images` skips this job today, but the gate is stated so that it
    # survives a change to what this waits on.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ankka-flow/
    permissions:
      contents: read
      id-token: write   # the OIDC token PyPI verifies
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: The SDK, its fixtures and the conformance suite
        working-directory: sdks/python
        run: |
          diff -r ../../protocol/src/main/protobuf proto/src/main/protobuf
          diff -r ../../protocol/fixtures proto/fixtures
          uv sync && uv run python scripts/proto.py && uv run mypy && uv run pytest -q && uv run conformance
      - name: Write the version, build the wheel
        working-directory: sdks/python
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = \"0.0.0\"/__version__ = \"$version\"/" src/ankka_flow/__init__.py
          grep -n "^__version__ = \"$version\"" src/ankka_flow/__init__.py
          rm -rf dist
          uv build
          ls -l dist
          test -f "dist/ankka_flow-$version-py3-none-any.whl" || { echo "::error::the wheel is not versioned as the tag"; exit 1; }
      - name: The wheel installs on its own and is the release it claims to be
        working-directory: sdks/python
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # An isolated interpreter with only the wheel and its declared dependencies: no checkout on the
          # path, so a stub the wheel does not carry or an undeclared dependency fails here rather than on
          # a user's first `uv add ankka-flow`.
          uv run --isolated --no-project --with "dist/ankka_flow-$version-py3-none-any.whl" python - "$version" <<'PY'
          import sys
          import ankka_flow, ankka_flow.testkit
          from ankka_flow._proto.ankka.flow.v1 import streamlet_pb2
          assert ankka_flow.__version__ == sys.argv[1], (ankka_flow.__version__, sys.argv[1])
          print("ankka-flow", ankka_flow.__version__, "protocol", ankka_flow.PROTOCOL_VERSION, "from", ankka_flow.__file__)
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  marketplace:
    # The Claude Code marketplace is thinkmorestupidless/ankka-marketplace, one plugin per project. This
    # job clones it, replaces `plugins/ankka-flow/` with the rendered plugin, writes ankka-flow's entry
    # into the manifest's `plugins` list without touching the others, and pushes an ordinary commit —
    # never a force push, which would erase the other projects' plugins. The manifest's name, owner and
    # description, and the README, are ankka's, published by ankka's own release. The documentation site
    # is published from main by docs.yml; a release adds the plugin, so that a version of the plugin
    # holds the documentation of that release.
    #
    # Needs `MARKETPLACE_REPO_TOKEN`: a token with contents:write on ankka-marketplace, because the
    # workflow's own token has no access to another repository.
    #
    # A release tag only: a pre-release (a tag with a hyphen) publishes no plugin.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # With credentials persisted, git would use the workflow's own token for every github.com
          # URL and the push below would authenticate as github-actions[bot] and be refused.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # The committed plugin must be the one the pages render to: a stale plugin is a failed release,
      # not a stale marketplace.
      - run: uv run --project tools/docs docs check
      - run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${{ secrets.MARKETPLACE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka-marketplace.git"
          # The plugin's version is the release whose documentation it carries: 0.0.0 in the tree,
          # written here, so no tracked file is rewritten by the build.
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$version\"/" marketplace/plugins/ankka-flow/.claude-plugin/plugin.json
          grep -n "\"version\": \"$version\"" marketplace/plugins/ankka-flow/.claude-plugin/plugin.json
          git clone --depth 1 "$remote" "$RUNNER_TEMP/marketplace"
          cd "$RUNNER_TEMP/marketplace"
          git config user.name "ankka-flow release"
          git config user.email "release@ankka-flow.invalid"
          rm -rf plugins/ankka-flow
          mkdir -p plugins
          cp -R "$GITHUB_WORKSPACE/marketplace/plugins/ankka-flow" plugins/ankka-flow
          # The entry is the plugin's own manifest, as the marketplace lists it; every other entry is
          # another project's and is kept as found. The list is sorted so the file is the same
          # whichever project released last.
          entry="$(jq -c '{name, source: ("./plugins/" + .name), description, version}' plugins/ankka-flow/.claude-plugin/plugin.json)"
          jq --argjson entry "$entry" \
            '.plugins = ([.plugins[] | select(.name != $entry.name)] + [$entry] | sort_by(.name))' \
            .claude-plugin/marketplace.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" .claude-plugin/marketplace.json
          jq . .claude-plugin/marketplace.json
          git add -A
          git commit -m "ankka-flow $version"
          # Another project's release may have pushed since the clone; rebase onto it and try again.
          for attempt in 1 2 3; do
            git push "$remote" HEAD:main && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase "$remote" main
          done
          git tag -f "ankka-flow-${GITHUB_REF_NAME}"
          git push --force "$remote" "ankka-flow-${GITHUB_REF_NAME}"
