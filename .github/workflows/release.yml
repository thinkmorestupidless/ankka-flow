name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the sidecar, the operator and the sample
        env:
          DOCKER_REPOSITORY: ghcr.io/thinkmorestupidless
        run: |
          sbt -Dflow.cluster.tests=off sidecar/docker:publish operator/docker:publish
          version="${GITHUB_REF_NAME#v}"
          docker build -f samples/cart-router/Dockerfile -t "ghcr.io/thinkmorestupidless/sample-cart-router:${version}" .
          docker push "ghcr.io/thinkmorestupidless/sample-cart-router:${version}"

  sdk-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v7
      - name: The SDK, its fixtures and the conformance suite (no PyPI publish in version one)
        working-directory: sdks/python
        run: |
          diff -r ../../protocol/src/main/protobuf proto/src/main/protobuf
          diff -r ../../protocol/fixtures proto/fixtures
          uv sync && uv run python scripts/proto.py && uv run mypy && uv run pytest -q && uv run conformance

  marketplace:
    # The Claude Code marketplace is thinkmorestupidless/ankka-marketplace, one plugin per project. This
    # job clones it, replaces `plugins/ankka-flow/` with the rendered plugin, writes ankka-flow's entry
    # into the manifest's `plugins` list without touching the others, and pushes an ordinary commit —
    # never a force push, which would erase the other projects' plugins. The manifest's name, owner and
    # description, and the README, are ankka's, published by ankka's own release. The documentation site
    # is published from main by docs.yml; a release adds the plugin, so that a version of the plugin
    # holds the documentation of that release.
    #
    # Needs `MARKETPLACE_REPO_TOKEN`: a token with contents:write on ankka-marketplace, because the
    # workflow's own token has no access to another repository.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # With credentials persisted, git would use the workflow's own token for every github.com
          # URL and the push below would authenticate as github-actions[bot] and be refused.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # The committed plugin must be the one the pages render to: a stale plugin is a failed release,
      # not a stale marketplace.
      - run: uv run --project tools/docs docs check
      - run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${{ secrets.MARKETPLACE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka-marketplace.git"
          # The plugin's version is the release whose documentation it carries: 0.0.0 in the tree,
          # written here, so no tracked file is rewritten by the build.
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$version\"/" marketplace/plugins/ankka-flow/.claude-plugin/plugin.json
          grep -n "\"version\": \"$version\"" marketplace/plugins/ankka-flow/.claude-plugin/plugin.json
          git clone --depth 1 "$remote" "$RUNNER_TEMP/marketplace"
          cd "$RUNNER_TEMP/marketplace"
          git config user.name "ankka-flow release"
          git config user.email "release@ankka-flow.invalid"
          rm -rf plugins/ankka-flow
          mkdir -p plugins
          cp -R "$GITHUB_WORKSPACE/marketplace/plugins/ankka-flow" plugins/ankka-flow
          # The entry is the plugin's own manifest, as the marketplace lists it; every other entry is
          # another project's and is kept as found. The list is sorted so the file is the same
          # whichever project released last.
          entry="$(jq -c '{name, source: ("./plugins/" + .name), description, version}' plugins/ankka-flow/.claude-plugin/plugin.json)"
          jq --argjson entry "$entry" \
            '.plugins = ([.plugins[] | select(.name != $entry.name)] + [$entry] | sort_by(.name))' \
            .claude-plugin/marketplace.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" .claude-plugin/marketplace.json
          jq . .claude-plugin/marketplace.json
          git add -A
          git commit -m "ankka-flow $version"
          # Another project's release may have pushed since the clone; rebase onto it and try again.
          for attempt in 1 2 3; do
            git push "$remote" HEAD:main && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase "$remote" main
          done
          git tag -f "ankka-flow-${GITHUB_REF_NAME}"
          git push --force "$remote" "ankka-flow-${GITHUB_REF_NAME}"
