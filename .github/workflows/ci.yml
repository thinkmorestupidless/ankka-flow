name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Maps changed paths onto jobs. An untouched job is skipped, which GitHub counts as a pass.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      scala: ${{ steps.filter.outputs.scala == 'true' || github.event_name != 'pull_request' }}
      sdk-python: ${{ steps.filter.outputs.sdk-python == 'true' || github.event_name != 'pull_request' }}
      features: ${{ steps.filter.outputs.features == 'true' || github.event_name != 'pull_request' }}
      cli-native: ${{ steps.filter.outputs.cli-native == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            scala:
              - *workflow
              - 'build.sbt'
              - 'project/**'
              - '.scalafmt.conf'
              - 'protocol/**'
              - 'blueprint/**'
              - 'crd/**'
              - 'sidecar/**'
              - 'operator/**'
              - 'cli/**'
              - 'kustomization/**'
              - 'sdks/scala/**'
              - 'samples/cart-router-scala/**'
              # flow init's template suite builds a Python project against this SDK, and the
              # templates carry the plugin's skills.
              - 'sdks/python/**'
              - 'marketplace/plugins/ankka-flow/skills/**'
              # The Scala sample runs the Python sample's blueprint and checks the fixture.
              - 'samples/cart-router/blueprint.conf'
            # The living features, the glossary their steps are written in, the specs that name
            # their scenarios, and the extension that checks them against each other.
            features:
              - *workflow
              - '.github/features-check.sh'
              - 'features/**'
              - 'GLOSSARY.md'
              - 'specs/**'
              - '.specify/extensions/bdd/**'
            # The CLI and what it is built from; a change to any of them can change what the
            # native image must carry.
            cli-native:
              - *workflow
              - 'build.sbt'
              - 'project/**'
              - 'protocol/**'
              - 'blueprint/**'
              - 'crd/**'
              - 'cli/**'
              - 'samples/*/blueprint.conf'
              - 'samples/*/flow/**'
              - 'marketplace/plugins/ankka-flow/skills/**'
            sdk-python:
              - *workflow
              - 'build.sbt'
              - 'project/**'
              - 'protocol/**'
              - 'sidecar/**'
              - 'sdks/python/**'
              - 'samples/**'

  # The living features, in the glossary's words, and the specs that name their scenarios, checked
  # against each other by speckit-bdd: an undefined word, a refused synonym, two scenarios that give
  # one situation different outcomes, a spec naming a scenario no feature has. The script reads the
  # extension's own config, so it checks what `/speckit-bdd-check` checks, with the same checker, and
  # it fails when nothing was read.
  features:
    needs: changes
    if: needs.changes.outputs.features == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: .github/features-check.sh

  build:
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -Dflow.cluster.tests=off scalafmtCheckAll scalafmtSbtCheck compile test
      - run: sbt mutationCheck
      # The Scala sample: its committed descriptor is what it declares, and its image builds.
      - run: sbt cartRouterScala/descriptorCheck cartRouterScala/docker:publishLocal

  # The CLI as a native binary, on one platform: the image built, the CLI's own suite run against
  # the binary instead of in process, and the smoke script with its byte-for-byte diff against the
  # JVM build. The other three platforms are built at a release; a reachability entry missing from
  # cli/src/main/resources/META-INF/native-image is found here, not at the tag.
  cli-native:
    needs: changes
    if: needs.changes.outputs.cli-native == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: sbt
          github-token: ${{ github.token }}
      - uses: sbt/setup-sbt@v1
      - run: sbt cli/stage cli/GraalVMNativeImage/packageBin
      - run: sbt 'cli/test' -Dflow.cli.binary="$PWD/cli/target/graalvm-native-image/flow"
      - run: cli/native-smoke.sh cli/target/graalvm-native-image/flow "" cli/target/universal/stage/bin/flow

  sdk-python:
    needs: changes
    if: needs.changes.outputs.sdk-python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # FR-027: the SDK's copy of the protocol is the protocol, byte for byte.
      - run: diff -r protocol/src/main/protobuf sdks/python/proto/src/main/protobuf
      - run: diff -r protocol/fixtures sdks/python/proto/fixtures
      - run: diff protocol/DESCRIPTOR.md sdks/python/proto/DESCRIPTOR.md
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v7
      - name: SDK
        working-directory: sdks/python
        run: |
          uv sync
          uv run python scripts/proto.py
          git diff --exit-code proto/
          uv build
          python3 -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl && /tmp/wheel/bin/python -c "import ankka_flow; print(ankka_flow.PROTOCOL_VERSION)"
          uv run mypy
          uv run pytest -q
          uv run conformance
      - name: Sample
        working-directory: samples/cart-router
        run: |
          uv sync
          uv run descriptor --check
          uv run pytest -q
      - name: Sample beside ankka
        working-directory: samples/checkout-feed
        run: |
          uv sync
          uv run descriptor --check
          uv run pytest -q
      - name: Sample graph
        working-directory: samples/checkout-graph
        run: |
          uv sync
          uv run descriptor --check
          uv run pytest -q
