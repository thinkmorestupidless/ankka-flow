# How `native-image` builds the flow CLI, read from the jar by any native build of it.
#
# --no-fallback: an image that cannot be built fails, rather than producing a JVM launcher in disguise.
# -march=compatibility: the default x64 target needs AVX2, and a binary for anyone's machine cannot.
# -Dsun.misc.unsafe.memory.access=allow: Scala 3's lazy vals use sun.misc.Unsafe, and a JDK 24+ base
#   otherwise prints a deprecation warning on every command.
# --enable-url-protocols: fabric8 reaches the API server over https and, for a mock server, http,
#   and a native image carries no protocol handlers unless asked.
# -H:+AddAllCharsets: the YAML reader behind a kubeconfig (snakeyaml-engine's unicode reader) names
#   UTF-32BE and UTF-32LE when it initialises, and an image carries only the standard charsets
#   unless asked; without this every `flow reset` fails before it reaches the cluster.
Args = --no-fallback \
       -march=compatibility \
       -Dsun.misc.unsafe.memory.access=allow \
       --enable-url-protocols=https,http \
       -H:+AddAllCharsets
