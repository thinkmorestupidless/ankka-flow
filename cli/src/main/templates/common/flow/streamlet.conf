# The sidecar's configuration for the compose network. In a cluster the operator renders the same
# file from the pipeline resource. descriptor.json beside it is the streamlet's descriptor.
flow {
  pipeline  = {{name}}
  streamlet = {{name}}
  config    = { greeting = "hello, ankka-flow" }
  inlets {
    in {
      topic             = "{{name}}.in"
      group             = "{{name}}.{{name}}.in"
      client-id         = "{{name}}.{{name}}.in"
      bootstrap.servers = "kafka:9092"
      connection-config {}
      consumer-config { auto.offset.reset = earliest }
      batch { max-records = 100, max-bytes = 1 MiB }
    }
  }
  outlets {
    out {
      topic             = "{{name}}.out"
      client-id         = "{{name}}.{{name}}.out"
      bootstrap.servers = "kafka:9092"
      connection-config {}
      producer-config {}
    }
  }
}
