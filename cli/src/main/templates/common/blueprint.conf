# The pipeline: the streamlet between an input topic something else writes and an output topic the
# pipeline owns. `flow verify blueprint.conf --descriptors flow` checks it against the descriptor.
blueprint {
  name = {{name}}
  streamlets {
    {{name}} = {{name}}
  }
  topics {
    # Written by something else: the pipeline reads it and never creates, alters or deletes it.
    in {
      managed           = false
      topic.name        = "{{name}}.in"
      bootstrap.servers = "kafka:9092"
      consumers         = [{{name}}.in]
      consumer-config { auto.offset.reset = earliest }
    }
    # The pipeline's own: the operator creates it as {{name}}.out.
    out {
      producers  = [{{name}}.out]
      partitions = 3
      replicas   = 1
    }
  }
}
