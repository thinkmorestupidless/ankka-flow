blueprint {
  name = cart
  streamlets {
    router = cart-router
    sink   = sink
  }
  topics {
    cart-events {
      managed    = false
      topic.name = "shop.cart-events.v1"
      cluster    = shop
      consumers  = [router.in]
      consumer-config { auto.offset.reset = earliest }
    }
    valid-carts {
      producers  = [router.valid]
      consumers  = [sink.in]
      partitions = 6
      replicas   = 1
      topic { retention.ms = 86400000 }
    }
    review-carts {
      producers = [router.review]
    }
  }
}
