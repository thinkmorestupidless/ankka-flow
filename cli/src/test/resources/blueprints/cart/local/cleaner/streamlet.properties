pipeline=carts
streamlet=cleaner
namespace=local
local=true

parameter.max-total=10000

inlet.in.topic=shop.cart-events.v1
inlet.in.group=carts.cleaner.in
inlet.in.client-id=carts.cleaner.in
inlet.in.kafka.auto.offset.reset=earliest
inlet.in.kafka.bootstrap.servers=localhost:9092

outlet.out.topic=carts.clean-carts
outlet.out.client-id=carts.cleaner.out
outlet.out.delivery=at-least-once
outlet.out.kafka.bootstrap.servers=localhost:9092
