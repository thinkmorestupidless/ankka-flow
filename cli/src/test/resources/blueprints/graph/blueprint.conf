blueprint {
  name = checkouts
  streamlets {
    mapper = mapper
    graph  = builtin/neo4j-merge-sink
  }
  topics {
    cart-checkouts {
      managed    = false
      topic.name = "cart-checkouts"
      cluster    = default
      consumers  = [mapper.in]
    }
    graph-deltas {
      producers  = [mapper.deltas]
      consumers  = [graph.in]
      partitions = 3
      replicas   = 1
    }
  }
}
