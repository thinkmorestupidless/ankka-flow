# The sample pipeline: the shop's cart events, cleaned.
blueprint {
  name = carts
  streamlets {
    cleaner = cart-cleaner
  }
  topics {
    cart-events {
      managed    = false
      topic.name = "shop.cart-events.v1"
      cluster    = shop
      consumers  = [cleaner.in]
      consumer-config { auto.offset.reset = earliest }
    }
    clean-carts {
      producers  = [cleaner.out]
      partitions = 3
    }
  }
}
