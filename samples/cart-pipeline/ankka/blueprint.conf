# The cleaner between two topics of the ankka project `checkout`: it reads the checkouts a service of
# the project publishes and writes the clean ones back to the project. Both topics are ankka's; the
# pipeline reaches them as the machine the deploy-time configuration names (flow.ankka.cluster).
#
#   flow verify blueprint.conf --descriptors flow --ankka-topics checkout=checkout-topics.json
# docs:start ankka-blueprint
blueprint {
  name = checkouts
  streamlets {
    cleaner = cart-cleaner
  }
  topics {
    cart-checkouts {
      ankka     = "checkout/cart-checkouts"
      consumers = [cleaner.in]
      consumer-config { auto.offset.reset = earliest }
    }
    clean-checkouts {
      ankka     = "checkout/clean-checkouts"
      producers = [cleaner.out]
    }
  }
}
# docs:end ankka-blueprint
