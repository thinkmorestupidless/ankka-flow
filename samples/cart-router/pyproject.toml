[project]
name = "cart-router"
version = "0.1.0"
description = "The ankka-flow sample: routes cart events to a valid or a review outlet."
requires-python = ">=3.12"
dependencies = ["ankka-flow"]

[dependency-groups]
dev = [
    "pytest>=8",
    "kafka-python>=2.2",
]

[tool.uv.sources]
ankka-flow = { path = "../../sdks/python", editable = true }

[tool.ankka-flow]
streamlet = "cart_router.router:CartRouter"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cart_router"]
