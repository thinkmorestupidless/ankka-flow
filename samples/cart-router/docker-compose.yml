# The laptop loop for the cart router: Kafka and the sidecar in containers, the router on the host.
# The sidecar waits for the router on host.docker.internal:9010; start them in either order.
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  sidecar:
    # `sbt sidecar/docker:publishLocal` in the repository root builds this tag.
    image: ${FLOW_SIDECAR_IMAGE:-ankka-flow-sidecar:latest}
    depends_on: [kafka]
    environment:
      FLOW_PROCESS_ADDRESS: host.docker.internal:9010
      FLOW_CONFIG_DIR: /etc/flow/config
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./flow:/etc/flow/config:ro
    ports:
      - "2050:2050"
