# The mapper's sidecar on the compose network. descriptor.json beside it is a copy of
# flow/descriptor.json, which `uv run descriptor` writes; the tests check the two are equal.
flow {
  pipeline  = checkouts-graph
  streamlet = mapper
  config    = {}
  inlets {
    in {
      topic             = "cart-checkouts"
      bootstrap.servers = "kafka:9092"
      consumer-config { auto.offset.reset = earliest }
    }
  }
  outlets {
    deltas { topic = "checkouts-graph.graph-deltas", bootstrap.servers = "kafka:9092" }
  }
}
