[project]
name = "checkout-graph"
version = "0.1.0"
description = "The ankka-flow graph sample: maps ankka's checkout notices to graph deltas for the built-in Neo4j merge sink."
requires-python = ">=3.12"
dependencies = ["ankka-flow"]

[dependency-groups]
dev = [
    "pytest>=8",
    "kafka-python>=2.2",
    "neo4j>=5.28,<6",
]

[tool.uv.sources]
ankka-flow = { path = "../../sdks/python", editable = true }

[tool.ankka-flow]
streamlet = "checkout_graph.mapper:CheckoutGraph"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_graph"]
