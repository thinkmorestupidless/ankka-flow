# The laptop loop for the graph sample: Kafka, Neo4j and two sidecars in containers, the mapper on
# the host. The mapper's sidecar waits for it on host.docker.internal:9010; the sink's sidecar runs
# the built-in merge stage and has no process at all.
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/flow-local-password
  sidecar-mapper:
    # `sbt sidecar/docker:publishLocal` in the repository root builds this tag.
    image: ${FLOW_SIDECAR_IMAGE:-ankka-flow-sidecar:latest}
    depends_on: [kafka]
    environment:
      FLOW_PROCESS_ADDRESS: host.docker.internal:9010
      FLOW_CONFIG_DIR: /etc/flow/config
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./flow-mapper:/etc/flow/config:ro
    ports:
      - "2050:2050"
  sidecar-graph:
    image: ${FLOW_SIDECAR_IMAGE:-ankka-flow-sidecar:latest}
    depends_on: [kafka, neo4j]
    environment:
      FLOW_CONFIG_DIR: /etc/flow/config
    volumes:
      - ./flow-graph:/etc/flow/config:ro
      # What the operator mounts from the connection Secret in a cluster: one file per key.
      - ./neo4j-secret:/etc/flow/neo4j:ro
    ports:
      - "2051:2050"
