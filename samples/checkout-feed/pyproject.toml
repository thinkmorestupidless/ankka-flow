[project]
name = "checkout-feed"
version = "0.1.0"
description = "The ankka-flow sample beside an ankka service: turns the shopping cart's checkout notices into a feed of checkouts."
requires-python = ">=3.12"
dependencies = ["ankka-flow"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
ankka-flow = { path = "../../sdks/python", editable = true }

[tool.ankka-flow]
streamlet = "checkout_feed.feed:CheckoutFeed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_feed"]
