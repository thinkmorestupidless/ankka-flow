# Neo4j 5.26 LTS (the first with dynamic labels in MERGE, which the merge sink needs), one node,
# reachable in the cluster at bolt://neo4j.neo4j.svc:7687.
apiVersion: v1
kind: Namespace
metadata:
  name: neo4j
---
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-auth
  namespace: neo4j
type: Opaque
stringData:
  NEO4J_AUTH: neo4j/flow-local-password
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: neo4j
spec:
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
    spec:
      # The Service named neo4j would inject NEO4J_PORT_* variables, which the image reads as
      # settings and refuses; no service links.
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          envFrom:
            - secretRef:
                name: neo4j-auth
          readinessProbe:
            tcpSocket:
              port: 7687
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# The Secret a pipeline in `shop` names in its merge sink's `secret` parameter
# (`flow.streamlets.<name>.config { secret = neo4j-local }`). The operator mounts it into the
# sink's sidecar at /etc/flow/neo4j; it never appears in the AnkkaFlow resource.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-local
  namespace: shop
type: Opaque
stringData:
  uri: bolt://neo4j.neo4j.svc:7687
  username: neo4j
  password: flow-local-password
  database: neo4j
